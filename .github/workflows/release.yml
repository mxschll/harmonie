name: release

# Auto-tag and release on every push to main. The bump level is the
# HIGHEST Conventional Commits level found among all pushed commits
# (a docs commit on top of a feat must not swallow the release):
#
#   feat!: ... (or feat(scope)!:)  -> major  (1.2.3 -> 2.0.0)
#   feat:  ... (or feat(scope):)   -> minor  (1.2.3 -> 1.3.0)
#   docs:, chore:, ci:             -> no bump on their own
#   fix:, refactor:, perf:, test:, style:, build:, anything else -> patch
#
# A push is skipped only when every commit in it is docs/chore/ci.
#
# To ship a release manually (e.g. a major, or a missed release), tag
# and push; the tag-push run creates the GitHub release directly:
#   git tag v2.0.0 && git push origin v2.0.0

on:
  push:
    branches: [main]
    tags: ['v[0-9]*.[0-9]*.[0-9]*']

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      # Empty when this push produced no release, which skips the image build.
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Decide bump
        id: decide
        if: github.ref_type == 'branch'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Scan every commit in the push, not just the tip. On force
          # pushes or history we don't have, fall back to the tip commit.
          if [[ "$BEFORE" =~ ^0+$ ]] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            subjects=$(git log -1 --pretty=%s "$AFTER")
          else
            subjects=$(git log --pretty=%s "$BEFORE..$AFTER")
          fi

          level=""
          while IFS= read -r subject; do
            [ -z "$subject" ] && continue
            echo "subject: $subject"
            # Conventional prefix: type, optional (scope), optional !, then ":"
            if echo "$subject" | grep -qE '^feat(\([^)]*\))?!:'; then
              commit_level=major
            elif echo "$subject" | grep -qE '^feat(\([^)]*\))?:'; then
              commit_level=minor
            elif echo "$subject" | grep -qE '^(docs|chore|ci)(\([^)]*\))?:'; then
              continue
            else
              commit_level=patch
            fi
            case "$commit_level" in
              major) level=major ;;
              minor) if [ "$level" != "major" ]; then level=minor; fi ;;
              patch) if [ -z "$level" ]; then level=patch; fi ;;
            esac
          done <<< "$subjects"

          if [ -z "$level" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping release: only docs/chore/ci commits in this push."
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "level=$level" >> "$GITHUB_OUTPUT"

      - name: Compute next version
        if: github.ref_type == 'branch' && steps.decide.outputs.skip == 'false'
        id: bump
        env:
          LEVEL: ${{ steps.decide.outputs.level }}
        run: |
          set -euo pipefail
          latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          latest=${latest:-v0.0.0}
          IFS='.' read -r major minor patch <<< "${latest#v}"
          case "$LEVEL" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          new="v${major}.${minor}.${patch}"
          echo "new=$new" >> "$GITHUB_OUTPUT"
          echo "Bumping ${latest} -> ${new} (level=${LEVEL})"

      - name: Push tag
        if: github.ref_type == 'branch' && steps.decide.outputs.skip == 'false'
        env:
          NEW_TAG: ${{ steps.bump.outputs.new }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$NEW_TAG"
          git push origin "$NEW_TAG"

      # Runs for branch pushes that produced a tag (the bot's tag push
      # doesn't retrigger workflows) and for manually pushed tags.
      - name: Create GitHub release
        if: github.ref_type == 'tag' || steps.decide.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || steps.bump.outputs.new }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || steps.bump.outputs.new }}
          generate_release_notes: true

      # The released version, without the leading v, for the image build.
      - name: Released version
        id: version
        if: github.ref_type == 'tag' || steps.decide.outputs.skip == 'false'
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || steps.bump.outputs.new }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  # Same tag-push problem as the GitHub release above: the bot's tag push does
  # not trigger docker.yml, so call it here.
  docker:
    needs: release
    if: needs.release.outputs.version != ''
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml
    with:
      version: ${{ needs.release.outputs.version }}

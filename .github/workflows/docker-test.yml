name: Docker

# Builds the image without publishing it and runs tests/test_docker.py
# against it: a one-shot scan, the service with its startup scan and API,
# and the HEALTHCHECK. docker.yml publishes on release tags only, so without
# this nothing would exercise the Dockerfile before a release.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docker-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  IMAGE: harmonie:ci

jobs:
  smoke:
    name: build and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The default leaves a token in .git/config, which the build context
          # would carry into the exported layer cache.
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.IMAGE }}
          build-args: |
            SETUPTOOLS_SCM_PRETEND_VERSION=0.0.0+ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        # Only what tests/test_docker.py and its fixtures import. The
        # application itself runs inside the image.
        run: pip install 'pytest>=8' 'pytest-asyncio>=0.23' numpy 'av>=15'

      - name: Smoke test the image
        run: pytest tests/test_docker.py -v --docker-image "$IMAGE"
